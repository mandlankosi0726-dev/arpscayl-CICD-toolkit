[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arpscayl-cicd-toolkit"
version = "0.1.0"
description = "Reusable CI/CD workflows and project validation utilities"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.setuptools]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["scripts*"]
exclude = ["configs*", "schemas*", "templates*", "examples*", "tests*"]