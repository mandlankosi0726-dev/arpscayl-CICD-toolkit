name: ArpScayl backup and recovery toolkit validation
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the backup toolkit pyproject.toml
        required: false
        type: string
        default: .
      python-version:
        description: Python version used by the toolkit
        required: false
        type: string
        default: "3.12"
      policy-file:
        description: Policy file validated in CI
        required: false
        type: string
        default: policies/development.yml
permissions:
  contents: read
jobs:
  backup-toolkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install backup toolkit and pinned audit tool
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev]' 'pip-audit==2.10.1'
      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy src
      - name: Run tests
        run: python -m pytest -q
      - name: Validate backup policy
        env:
          POLICY_FILE: ${{ inputs.policy-file }}
        run: arpscayl-bdr config validate --file "$POLICY_FILE"
      - name: Audit installed Python dependencies
        run: python -m pip_audit --strict
