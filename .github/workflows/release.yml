name: Create toolkit release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", os.environ["RELEASE_TAG"]):
              print("Release tags must use vMAJOR.MINOR.PATCH", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Create release manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          with open("release-manifest.json", "w", encoding="utf-8") as manifest:
              json.dump({"tag": os.environ["RELEASE_TAG"], "commit": os.environ["SOURCE_COMMIT"], "workflow_run": os.environ["RUN_URL"]}, manifest, indent=2)
              manifest.write("\n")
          PY
      - name: Publish GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" release-manifest.json --verify-tag --target "$SOURCE_COMMIT" --title "$RELEASE_TAG" --generate-notes
