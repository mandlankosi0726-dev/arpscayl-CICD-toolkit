name: Bun frontend CI
on:
  workflow_call:
    inputs:
      bun-version:
        description: Exact Bun version to install
        required: false
        type: string
        default: "1.4.4"
      working-directory:
        description: Directory containing package.json and bun.lock
        required: false
        type: string
        default: .
      run-typecheck:
        description: Run the package's typecheck script
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  bun-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run lint script
        run: bun run lint
      - name: Run test script
        run: bun run test
      - name: Build application
        run: bun run build
      - name: Type check
        if: inputs.run-typecheck
        run: bun run typecheck
