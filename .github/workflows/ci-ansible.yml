name: Ansible syntax and lint validation
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing requirements, inventories and playbooks
        required: false
        type: string
        default: .
      python-version:
        description: Python version for Ansible tooling
        required: false
        type: string
        default: "3.12"
      ansible-core-version:
        description: Exact supported Ansible Core version
        required: false
        type: string
        default: "2.20.7"
permissions:
  contents: read
jobs:
  ansible-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install Ansible validation tools
        env:
          ANSIBLE_CORE_VERSION: ${{ inputs.ansible-core-version }}
        run: |
          if [[ ! "$ANSIBLE_CORE_VERSION" =~ ^2\.(18|19|20)\.[0-9]+$ ]]; then
            echo 'ansible-core-version must be an exact supported 2.18.x, 2.19.x, or 2.20.x version' >&2
            exit 1
          fi
          python -m pip install --disable-pip-version-check \
            "ansible-core==$ANSIBLE_CORE_VERSION" \
            'ansible-lint==25.12.2' 'yamllint==1.35.1' 'pytest==8.3.5'
          if [ -f requirements.yml ]; then ansible-galaxy collection install -r requirements.yml; fi
      - name: Validate the checked-in inert inventory without connecting to hosts
        run: ansible-inventory -i inventories/development/hosts.yml --list >/dev/null
      - name: Check playbook syntax without connecting to hosts
        run: |
          shopt -s nullglob
          playbooks=(playbooks/*.yml playbooks/*.yaml)
          if [ "${#playbooks[@]}" -eq 0 ]; then
            echo 'No playbooks found in playbooks/' >&2
            exit 1
          fi
          for playbook in "${playbooks[@]}"; do
            ansible-playbook -i inventories/development/hosts.yml "$playbook" --syntax-check
          done
      - name: Lint Ansible and YAML
        run: |
          ansible-lint
          yamllint .
      - name: Run local validation tests
        run: python -m pytest -q
