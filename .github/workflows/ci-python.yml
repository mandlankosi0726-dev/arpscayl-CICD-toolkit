name: Python CI
on:
  workflow_call:
    inputs:
      python-version:
        description: Supported Python version to use
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: Directory containing the Python project
        required: false
        type: string
        default: .
      requirements-file:
        description: Requirements file to install; empty string skips file installation
        required: false
        type: string
        default: requirements.txt
      project-install:
        description: Optional pip install target such as .[dev,api]
        required: false
        type: string
        default: ""
      run-typecheck:
        description: Run mypy (the project must install/configure it)
        required: false
        type: boolean
        default: false
      run-compileall:
        description: Compile Python source files before running tests
        required: false
        type: boolean
        default: false
      compile-path:
        description: File or directory passed to compileall
        required: false
        type: string
        default: .
      run-pip-check:
        description: Check installed dependency consistency
        required: false
        type: boolean
        default: false
      run-pip-audit:
        description: Audit the selected requirements file or installed environment
        required: false
        type: boolean
        default: false
      pip-audit-version:
        description: Exact pip-audit package version to install when auditing
        required: false
        type: string
        default: "2.10.1"
      coverage-minimum:
        description: Minimum test coverage percentage; 0 disables coverage enforcement
        required: false
        type: number
        default: 0
permissions:
  contents: read
jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install project dependencies
        if: inputs.requirements-file != ''
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: python -m pip install --disable-pip-version-check -r "$REQUIREMENTS_FILE"
      - name: Install project and extras
        if: inputs.project-install != ''
        env:
          PROJECT_INSTALL: ${{ inputs.project-install }}
        run: python -m pip install --disable-pip-version-check "$PROJECT_INSTALL"
      - name: Install CI tools
        run: python -m pip install --disable-pip-version-check 'ruff==0.11.0' 'pytest==8.3.5' 'pytest-cov==6.0.0'
      - name: Install dependency auditor
        if: inputs.run-pip-audit
        env:
          PIP_AUDIT_VERSION: ${{ inputs.pip-audit-version }}
        run: |
          if [[ ! "$PIP_AUDIT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'pip-audit-version must be an exact x.y.z version' >&2
            exit 1
          fi
          python -m pip install --disable-pip-version-check "pip-audit==$PIP_AUDIT_VERSION"
      - name: Compile Python sources
        if: inputs.run-compileall
        env:
          COMPILE_PATH: ${{ inputs.compile-path }}
        run: python -m compileall -q "$COMPILE_PATH"
      - name: Lint with Ruff
        run: python -m ruff check .
      - name: Test with pytest
        env:
          COVERAGE_MINIMUM: ${{ inputs.coverage-minimum }}
        run: |
          if [ "$COVERAGE_MINIMUM" = "0" ]; then
            python -m pytest -q --junitxml=test-results.xml
          else
            python -m pytest -q --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under="$COVERAGE_MINIMUM" --junitxml=test-results.xml
          fi
      - name: Check dependency consistency
        if: inputs.run-pip-check
        run: python -m pip check
      - name: Audit Python dependencies
        if: inputs.run-pip-audit
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: |
          if [ -n "$REQUIREMENTS_FILE" ]; then
            python -m pip_audit --strict -r "$REQUIREMENTS_FILE"
          else
            python -m pip_audit --strict
          fi
      - name: Type check with mypy
        if: inputs.run-typecheck
        run: python -m mypy .
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-ci-reports
          path: |
            ${{ inputs.working-directory }}/test-results.xml
            ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
