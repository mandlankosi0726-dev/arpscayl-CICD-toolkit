name: Python CI
on:
  workflow_call:
    inputs:
      python-version:
        description: Supported Python version to use
        required: false
        type: string
        default: "3.12"
      working-directory:
        description: Directory containing the Python project
        required: false
        type: string
        default: .
      requirements-file:
        description: Pinned requirements file; empty string skips dependency installation
        required: false
        type: string
        default: requirements.txt
      run-typecheck:
        description: Run mypy (the project must install/configure it)
        required: false
        type: boolean
        default: false
      coverage-minimum:
        description: Minimum test coverage percentage; 0 disables coverage enforcement
        required: false
        type: number
        default: 0
permissions:
  contents: read
jobs:
  python-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install project dependencies
        if: inputs.requirements-file != ''
        env:
          REQUIREMENTS_FILE: ${{ inputs.requirements-file }}
        run: python -m pip install --disable-pip-version-check -r "$REQUIREMENTS_FILE"
      - name: Install CI tools
        run: python -m pip install --disable-pip-version-check 'ruff==0.11.0' 'pytest==8.3.5' 'pytest-cov==6.0.0'
      - name: Lint with Ruff
        run: python -m ruff check .
      - name: Test with pytest
        env:
          COVERAGE_MINIMUM: ${{ inputs.coverage-minimum }}
        run: |
          if [ "$COVERAGE_MINIMUM" = "0" ]; then
            python -m pytest -q --junitxml=test-results.xml
          else
            python -m pytest -q --cov --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under="$COVERAGE_MINIMUM" --junitxml=test-results.xml
          fi
      - name: Type check with mypy
        if: inputs.run-typecheck
        run: python -m mypy .
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-ci-reports
          path: |
            ${{ inputs.working-directory }}/test-results.xml
            ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore
          retention-days: 7
