name: Validate toolkit
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        run: python3 -m venv .venv && . .venv/bin/activate && python -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Validate configuration
        run: . .venv/bin/activate && python scripts/validate_config.py --config configs/defaults.yml
      - name: Validate workflows
        run: . .venv/bin/activate && python scripts/validate_workflows.py
