name: Validate toolkit
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
      - name: Install toolkit validation dependencies
        run: python -m pip install --disable-pip-version-check -e .
      - name: Validate configuration
        run: python scripts/validate_config.py --config configs/defaults.yml
      - name: Validate workflows
        run: python scripts/validate_workflows.py
