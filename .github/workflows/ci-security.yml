name: ArpScayl security toolkit validation
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the security toolkit pyproject.toml
        required: false
        type: string
        default: .
      python-version:
        description: Python version used by the toolkit
        required: false
        type: string
        default: "3.12"
      policy-file:
        description: Policy file validated in CI
        required: false
        type: string
        default: policies/linux-baseline.yaml
permissions:
  contents: read
jobs:
  security-toolkit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ inputs.python-version }}
      - name: Install security toolkit and pinned audit tool
        run: |
          python -m pip install --disable-pip-version-check -e '.[dev,api]' 'pip-audit==2.10.1'
      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Type check
        run: python -m mypy src
      - name: Run unit and API tests
        run: python -m pytest -q
      - name: Validate Linux policy
        env:
          POLICY_FILE: ${{ inputs.policy-file }}
        run: arpscayl-security policy validate "$POLICY_FILE"
      - name: Audit installed Python dependencies
        run: python -m pip_audit --strict
