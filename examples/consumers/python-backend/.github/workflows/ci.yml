name: Python backend validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    uses: mandlankosi0726-dev/arpscayl-CICD-toolkit/.github/workflows/ci-python.yml@v0.1.0
    with:
      working-directory: backend
      python-version: "3.12"
      requirements-file: requirements.txt
      run-compileall: true
      compile-path: .
      run-pip-check: true
      run-pip-audit: true
