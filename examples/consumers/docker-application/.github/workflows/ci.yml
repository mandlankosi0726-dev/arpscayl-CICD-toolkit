name: Docker application validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docker:
    uses: mandlankosi0726-dev/arpscayl-CICD-toolkit/.github/workflows/ci-docker.yml@v0.1.0
    with:
      context: .
      dockerfile: Dockerfile
      require-non-root: true
      scan-severity: HIGH,CRITICAL
